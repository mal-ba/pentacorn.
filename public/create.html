<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제작 스튜디오 — UNEXPOSED</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --deep:#0F2E2C; --deep-2:#123B38; --mist:#F5F2EA; --paper:#FBFAF6; --star:#6FB8C2; --star-dark:#3E7F86;
    --coral:#D8663F; --ink:#14201E; --ink-soft:#4A5654; --line:rgba(20,32,30,0.12); --radius:18px;
  }
  *{box-sizing:border-box;}
  a{color:inherit; text-decoration:none;}
  body{ font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink); margin:0; line-height:1.6; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 6vw; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; color:var(--ink); }
  .brand svg{ width:24px; height:24px; }
  .back-link{ font-size:13.5px; color:var(--ink-soft); }
  .back-link:hover{ color:var(--star-dark); }
  .nav-left{ display:flex; align-items:center; gap:14px; }
  .menu-toggle-btn{ width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  main{ max-width:640px; margin:0 auto; padding:32px 6vw 100px; }
  .eyebrow{ font-size:12.5px; letter-spacing:0.08em; color:var(--star-dark); font-weight:700; margin-bottom:8px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(24px,4vw,32px); margin:0 0 6px; }
  .lede{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
</style>
<link rel="stylesheet" href="/create.css">
</head>
<body>

<header>
  <div class="nav-left">
    <button class="menu-toggle-btn" id="menu-toggle-btn" type="button" aria-label="메뉴 열기">
      <svg viewBox="0 0 20 14" width="20" height="14"><rect width="20" height="2" rx="1" fill="currentColor"/><rect y="6" width="20" height="2" rx="1" fill="currentColor"/><rect y="12" width="20" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <a class="brand" href="/">
      <svg viewBox="0 0 100 100"><polygon points="50,4 91,35 75,90 25,90 9,35" fill="#0F2E2C"/><polygon points="50,20 78,42 67,80 33,80 22,42" fill="#F5F2EA"/></svg>
      UNEXPOSED
    </a>
  </div>
  <a class="back-link" href="/">← 홈으로</a>
</header>

<div id="side-menu-mount"></div>

<main>
  <div class="eyebrow">제작 스튜디오 (베타)</div>
  <h1>내 치수·원단으로 옷 만들기</h1>
  <p class="lede">옷 종류와 기장·둘레를 정하고, 앞면·뒷면·소매·옆면마다 원하는 원단을 골라 채색해보세요. 완성한 디자인은 이후 체형 스캔 결과와 합쳐져요.</p>

  <div class="type-row" id="type-row"></div>

  <div class="viewer-box">
    <div id="create-3d"></div>
    <p class="viewer-loading" id="create-loading">마네킹을 불러오는 중…</p>
    <p class="viewer-hint">드래그로 회전 · 옷을 탭해서 채색</p>
  </div>

  <div class="size-grid">
    <label>
      <span>기장</span>
      <input type="range" id="length-range" min="0.6" max="1.6" step="0.02" value="1">
    </label>
    <label>
      <span>둘레</span>
      <input type="range" id="girth-range" min="0.7" max="1.5" step="0.02" value="1">
    </label>
  </div>

  <div class="section-label">원단 선택 <span class="hint">(고른 뒤 옷을 탭하세요)</span></div>
  <div class="fabric-row" id="fabric-row"></div>

  <div class="section-label">부위별 배정 현황</div>
  <div class="part-list" id="part-list"></div>

  <div class="reset-row">
    <button class="btn btn-ghost-dark" id="reset-btn" type="button">이 옷 초기화</button>
  </div>
</main>

<div id="footer-mount"></div>
<script src="/menu-loader.js"></script>
<script src="/site-footer.js" defer></script>
<script type="module" src="/create.js"></script>
</body>
</html>
